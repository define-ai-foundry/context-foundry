{{- include "context-foundry-fusion.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "context-foundry-fusion.fullname" . }}
  labels:
    {{- include "context-foundry-fusion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "context-foundry-fusion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "context-foundry-fusion.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /* The app reads the sensor registry once at startup and never reloads it,
             so a registry edit has to replace the pod. Hashing the rendered
             ConfigMap makes the pod template change with it, which the Recreate
             strategy turns into a restart. Nothing to hash when the registry
             lives in a ConfigMap the chart does not own (config.existingConfigMap):
             an edit there leaves the pod running the registry it started with. */}}
      {{- $cfgsum := "" }}
      {{- if not .Values.config.existingConfigMap }}
      {{- $cfgsum = include (print $.Template.BasePath "/configmap-sensors.yaml") . | sha256sum }}
      {{- end }}
      {{- if or $cfgsum .Values.podAnnotations }}
      annotations:
        {{- if $cfgsum }}
        checksum/config: {{ $cfgsum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "context-foundry-fusion.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.hostNetwork.enabled }}
      hostNetwork: true
      {{- end }}
      dnsPolicy: {{ include "context-foundry-fusion.dnsPolicy" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "context-foundry-fusion.args" . | nindent 12 }}
          {{- if include "context-foundry-fusion.liveSource" . }}
          ports:
            {{- if .Values.sources.sapient.enabled }}
            - name: sapient-udp
              containerPort: 5000
              protocol: UDP
              {{- if .Values.hostPorts.enabled }}
              hostPort: 5000
              {{- end }}
            {{- end }}
            {{- if .Values.sources.cot.enabled }}
            - name: cot-udp
              containerPort: 6969
              protocol: UDP
              {{- if .Values.hostPorts.enabled }}
              hostPort: 6969
              {{- end }}
            {{- end }}
          {{- end }}
          {{- $env := include "context-foundry-fusion.env" . }}
          {{- if trim $env }}
          env:
            {{- $env | trim | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sensors-config
              mountPath: /etc/context-foundry
              readOnly: true
            {{- if include "context-foundry-fusion.caEnabled" . }}
            - name: tak-ca
              mountPath: {{ include "context-foundry-fusion.caDir" . }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          # No HTTP endpoint is exposed (outbound WS client) — no probes.
      volumes:
        - name: sensors-config
          configMap:
            name: {{ include "context-foundry-fusion.configMapName" . }}
        {{- if include "context-foundry-fusion.caEnabled" . }}
        # CA bundle the WS sink verifies the TAK server's chain against.
        - name: tak-ca
          secret:
            secretName: {{ .Values.sinks.takWs.caSecret.name }}
            items:
              - key: {{ .Values.sinks.takWs.caSecret.key | quote }}
                path: {{ .Values.sinks.takWs.caSecret.key | quote }}
        {{- end }}
        # readOnlyRootFilesystem leaves no writable path anywhere, and libraries
        # in the dependency tree expect one: matplotlib (pulled in by stonesoup)
        # raises OSError on import when it can neither write its cache dir nor
        # create a temp dir. Nothing on the current code path imports it, so this
        # is insurance against a dependency or import change, not a live fix.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDir.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
