{{- include "context-foundry-fusion.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "context-foundry-fusion.fullname" . }}
  labels:
    {{- include "context-foundry-fusion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "context-foundry-fusion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "context-foundry-fusion.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "context-foundry-fusion.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "context-foundry-fusion.args" . | nindent 12 }}
          {{- $env := include "context-foundry-fusion.env" . }}
          {{- if trim $env }}
          env:
            {{- $env | trim | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: sensors-config
              mountPath: /etc/context-foundry
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # No HTTP endpoint is exposed (outbound WS client) — no probes.
      volumes:
        - name: sensors-config
          configMap:
            name: {{ include "context-foundry-fusion.configMapName" . }}
        # readOnlyRootFilesystem leaves no writable path anywhere, and libraries
        # in the dependency tree expect one: matplotlib (pulled in by stonesoup)
        # raises OSError on import when it can neither write its cache dir nor
        # create a temp dir. Nothing on the current code path imports it, so this
        # is insurance against a dependency or import change, not a live fix.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpDir.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
