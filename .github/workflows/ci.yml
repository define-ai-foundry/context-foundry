name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Pytest with coverage
        run: pytest

  helm:
    runs-on: ubuntu-latest
    env:
      CHART: deploy/helm/context-foundry-fusion
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint "$CHART"

      # Render each supported shape to catch template/guard regressions.
      - name: Helm template (default — looping replay feed to WebTAK WS)
        run: helm template ci "$CHART" >/dev/null

      - name: Helm template (live UDP source + Service)
        run: helm template ci "$CHART" --set sources.sapient.enabled=true --set service.enabled=true >/dev/null
