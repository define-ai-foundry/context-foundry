# Tracker Core Parameters
tracker:
  coordinate_system: "ENU"         # Local East-North-Up projection
  update_interval_sec: 0.1         # Main tracking loop cycle rate (10Hz)
  max_track_history: 100           # Number of state vectors retained per track

# Gating & Association Thresholds
gating:
  max_mahalanobis_distance: 9.21   # 99% confidence gate boundary for 2 degrees of freedom
  missed_updates_limit: 5          # Number of consecutive missed updates before dropping a track
  min_initiation_confidence: 0.70  # Minimum probability threshold to instantiate a tentative track

# Kinematic State Motion Models (Process Noise Covariance scaling)
motion_models:
  constant_velocity:
    q_noise_xyz: [0.5, 0.5, 0.1]   # Process noise scaling for positional variance
  constant_acceleration:
    q_noise_xyz: [1.0, 1.0, 0.2]

# Sensor Source Profiles (Weights, Expected Latencies, and Variances)
sensor_profiles:
  radar:
    measurement_variance_range: 0.25 # Meters
    measurement_variance_bearing: 0.02 # Radians
    max_allowable_latency_sec: 0.3
    weight: 1.0
  acoustic:
    measurement_variance_bearing: 0.15 # Higher bearing noise for azimuth-only sources
    max_allowable_latency_sec: 0.8
    weight: 0.4
  electro_optical:
    measurement_variance_bearing: 0.01 
    measurement_variance_elevation: 0.01
    max_allowable_latency_sec: 0.2
    weight: 0.8