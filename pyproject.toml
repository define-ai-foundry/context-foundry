[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-foundry"
version = "0.1.0"
description = "Tactical Edge Sensor Fusion and Contextual Augmentation Gateway"
readme = "README.md"
# Union type syntax (X | None) used across the codebase requires 3.10+.
requires-python = ">=3.10"
dependencies = [
    "stonesoup",
    "numpy",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.1",
    "grpcio-tools>=1.81.0",
    "protobuf>=6.33.5",
    "lxml",
    "takproto>=3.0.0",
    "websocket-client>=1.7.0",
    "requests>=2.31.0",
    # The pipeline's Kafka topics (--kafka-topic, --kafka-output-topic).
    "confluent-kafka>=2.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
context-foundry-fusion = "context_foundry.cli:fusion_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# Generated protobuf bindings are not ours to lint.
extend-exclude = ["src/sapient_msg"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S311",  # pseudo-random generators: used for sensor-noise modelling, not crypto
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # asserts are the point of tests
    "S603",  # subprocess calls in CLI tests are trusted
    "S105",  # dummy tokens/secrets in fixtures are not real credentials
    "S106",  # dummy tokens/secrets passed as kwargs in fixtures
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=context_foundry --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["context_foundry"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]