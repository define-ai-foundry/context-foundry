[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-foundry"
version = "0.1.0"
description = "Tactical Edge Sensor Fusion and Contextual Augmentation Gateway"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "stonesoup",
    "numpy",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.1",
    "grpcio-tools>=1.81.0",
    "protobuf>=6.33.5",
    "lxml"
]

[project.scripts]
context-foundry-fusion = "context_foundry.cli:fusion_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]